server:
  port: 8080

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/robotops}
    username: ${SPRING_DATASOURCE_USERNAME:app}
    password: ${SPRING_DATASOURCE_PASSWORD:app}
  jpa:
    hibernate:
      ddl-auto: create
  sql:
    init:
      mode: always
  data:
    redis:
      port: 6379
      host: redis
  kafka:
    bootstrap-servers: kafka:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: robot-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}

app:
  mqtt:
    brokerUrl: ${MQTT_BROKER_URL:tcp://mqtt:1883}

robotops:
  kafka:
    insight-feed-partitions: 6
    insight-openai-concurrency: 6
    ensure-partitions: true

openai:
  api-key: ${OPENAI_API_KEY}
  model: gpt-5-mini

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics

  endpoint:
    health:
      show-details: always

  metrics:
    tags:
      application: robot-ops-backend

logging:
  level:
    org.springframework.ai: DEBUG
    org.springframework.ai.chat.client.advisor: DEBUG