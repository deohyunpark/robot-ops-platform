spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/robotops_test
    username: app
    password: app

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        generate_statistics: true
    show-sql: true

  sql:
    init:
      mode: never
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092

openai:
  api-key: test-key

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE